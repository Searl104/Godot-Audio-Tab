# Builds the Audio Workstation engine (GDExtension) for Linux, Windows and macOS and
# packages the addon with all binaries. Runs on pushes, pull requests and manually.
name: Build engine

on:
  push:
    paths: ["extension/**", "addons/**", ".github/workflows/build-engine.yml"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_CPP_TAG: 10.0.0-stable

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-24.04,     platform: linux,   arch: x86_64 }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, platform: linux,   arch: arm64 }
          - { name: windows-x86_64, os: windows-2022,     platform: windows, arch: x86_64 }
          - { name: macos-universal, os: macos-14,        platform: macos,   arch: universal }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch godot-cpp (pinned)
        shell: bash
        run: git clone --depth 1 --branch "$GODOT_CPP_TAG" https://github.com/godotengine/godot-cpp.git extension/godot-cpp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons==4.8.1

      - name: Cache godot-cpp objects
        uses: actions/cache@v4
        with:
          path: extension/godot-cpp/bin
          key: godot-cpp-${{ env.GODOT_CPP_TAG }}-${{ matrix.name }}-${{ hashFiles('extension/SConstruct') }}

      - name: Build debug (editor) and release
        working-directory: extension
        shell: bash
        run: |
          scons -j4 platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug
          scons -j4 platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: addons/audio_workstation/bin/

  package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: addons/audio_workstation/bin
          merge-multiple: true
      - name: Install the .gdextension manifest
        run: cp extension/aw_engine.gdextension addons/audio_workstation/
      - uses: actions/upload-artifact@v4
        with:
          name: audio_workstation-addon
          path: addons/audio_workstation/
